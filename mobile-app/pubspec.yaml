name: lapiez_app
description: "Official Android & iOS Mobile Application for Lapiez IT Hardware & Security Showroom, Garhwa."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  flutter_spinkit: ^5.2.1
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
